# One public port, three web UIs
server {
    listen 80;

    location = /jaeger     { return 301 /jaeger/; }
    location /jaeger/      { proxy_pass http://jaeger:16686; }

    location = /prometheus { return 301 /prometheus/; }
    location /prometheus/  { proxy_pass http://prometheus:9090; }

    location /             { proxy_pass http://notes:8000; }
}
